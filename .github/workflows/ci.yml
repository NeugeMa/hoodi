name: ci
on:
  pull_request:
  push:
    branches: ['**']
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:pet
      - run: npm run typecheck
      - name: perfis EAS (produção fecha o modo demo)
        run: npm run verificar:eas
